name: CI Pipeline

# trigger pipeline on push or pull request
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# define the "Jobs"
jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: cd services/auth-service && npm install
      - name: Run unit tests
        run: cd services/auth-service && npm run test:unit
      - name: Run integration tests
        run: cd services/auth-service && npm run test:integration

  test-user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: cd services/user-service && npm install
      - name: Run unit tests
        run: cd services/user-service && npm run test:unit
      - name: Run integration tests
        run: cd services/user-service && npm run test:integration

  test-task-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: cd services/task-service && npm install
      - name: Run unit tests
        run: cd services/task-service && npm run test:unit
      - name: Run integration tests
        run: cd services/task-service && npm run test:integration
